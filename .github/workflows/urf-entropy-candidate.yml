name: URF isolated entropy verification
on:
  push:
    branches:
      - research/entropy-uniform-radius-audit-20261118
    paths:
      - '.github/workflows/urf-entropy-candidate.yml'
      - 'research/candidates/URFCoreUniformConditionalExplicitKernelCandidate.lean'
      - 'research/candidates/URFCoreSpokeRowIsolationCandidate.lean'
      - 'research/candidates/URFCoreSharpCliqueEntropyCandidate.lean'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/research/entropy-uniform-radius-audit-20261118'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean and restore mathlib cache
        uses: leanprover/lean-action@v1
        with:
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Check exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(head -n 1 lean-toolchain)" = 'leanprover/lean4:v4.27.0'
          lake env lean --version
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'a3a10db0e9d66acbebf76c5e6a135066525ac900'
          git diff --exit-code -- lean-toolchain lake-manifest.json
      - name: Compile isolated candidate and audit axioms
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/urf-receipt"
          source_file=research/candidates/URFCoreUniformConditionalExplicitKernelCandidate.lean
          sha256sum "$source_file" > "$RUNNER_TEMP/urf-receipt/source.sha256"
          git rev-parse HEAD > "$RUNNER_TEMP/urf-receipt/head.txt"
          lake env lean "$source_file" 2>&1 | tee "$RUNNER_TEMP/urf-receipt/lean.log"
          python3 - "$RUNNER_TEMP/urf-receipt/lean.log" <<'PY'
          import sys, re
          s = open(sys.argv[1]).read()
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          for name in ("uniform_entropy_exact_candidate",
                       "uniform_fiber_entropy_exact_candidate",
                       "linear_uniform_conditional_entropy_exact_candidate"):
              full = "URF.EntropyBridge." + name
              m = re.search(r"'" + re.escape(full) + r"' depends on axioms: \[([^\]]*)\]", s)
              if m is None:
                  if ("'" + full + "' does not depend on any axioms") in s:
                      print(full, ":= AXIOM_PASS")
                      continue
                  raise SystemExit("Missing axiom receipt: " + full)
              found = {a.strip() for a in m.group(1).split(",") if a.strip()}
              if not found <= allowed:
                  raise SystemExit("Disallowed axioms: " + str(found - allowed))
              print(full, ":= AXIOM_PASS")
          print("AXIOM_AUDIT := PASS")
          PY
      - name: Compile concrete spoke-only theorem and audit axioms
        shell: bash
        run: |
          set -euo pipefail
          source_file=research/candidates/URFCoreSpokeRowIsolationCandidate.lean
          sha256sum "$source_file" > "$RUNNER_TEMP/urf-receipt/spoke.sha256"
          lake env lean "$source_file" 2>&1 | tee "$RUNNER_TEMP/urf-receipt/spoke.log"
          python3 - "$RUNNER_TEMP/urf-receipt/spoke.log" <<'PY'
          import sys, re
          s = open(sys.argv[1]).read()
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          for name in ("matrix_zero_of_isolating_rows_candidate",
                       "orderedEdge_unique_incident_pair_candidate",
                       "spoke_isolation_candidate",
                       "spoke_only_zero_candidate",
                       "simpleGraphBoundary_spoke_zero_candidate",
                       "circulation_eq_of_rim_eq_candidate",
                       "circulation_rim_decomposition_candidate",
                       "boundary_unit_edge_candidate",
                       "directed_edge_boundary_candidate",
                       "cone_triangle_boundary_candidate",
                       "cone_triangle_rim_delta_candidate",
                       "radius_one_triangle_generation_candidate",
                       "radiusOne_le_triangleBoundary_candidate",
                       "cone_triangle_closedBall_support_candidate",
                       "triangleBoundary_le_radiusOne_candidate",
                       "radiusOne_eq_triangleBoundary_candidate",
                       "triangleBoundary_le_cycleKernel_candidate",
                       "radiusOne_localCycles_eq_cliqueBoundary_candidate",
                       "cliqueH1_finrank_candidate",
                       "radiusOne_hidden_finrank_eq_cliqueH1_candidate"):
              full = "URF.EntropyBridge." + name
              m = re.search(r"'" + re.escape(full) + r"' depends on axioms: \[([^\]]*)\]", s)
              if m is None:
                  if ("'" + full + "' does not depend on any axioms") in s:
                      print(full, ":= AXIOM_PASS")
                      continue
                  raise SystemExit("Missing axiom receipt: " + full)
              found = {a.strip() for a in m.group(1).split(",") if a.strip()}
              if not found <= allowed:
                  raise SystemExit("Disallowed axioms: " + str(found - allowed))
              print(full, ":= AXIOM_PASS")
          print("SPOKE_AXIOM_AUDIT := PASS")
          PY
      - name: Compile sharp clique entropy assembly and audit axioms
        shell: bash
        run: |
          set -euo pipefail
          source_file=research/candidates/URFCoreSharpCliqueEntropyCandidate.lean
          sha256sum "$source_file" > "$RUNNER_TEMP/urf-receipt/sharp.sha256"
          lake env lean "$source_file" 2>&1 | tee "$RUNNER_TEMP/urf-receipt/sharp.log"
          python3 - "$RUNNER_TEMP/urf-receipt/sharp.log" <<'PY'
          import sys, re
          s = open(sys.argv[1]).read()
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          for name in ("radiusOne_kernel_card_eq_pow_cliqueH1_candidate",
                       "radiusOne_log_kernel_eq_cliqueH1_candidate",
                       "radiusOne_entropy_le_cliqueH1_candidate",
                       "radiusOne_uniform_entropy_eq_cliqueH1_candidate"):
              full = "URF.EntropyBridge." + name
              m = re.search(r"'" + re.escape(full) + r"' depends on axioms: \[([^\]]*)\]", s)
              if m is None:
                  if ("'" + full + "' does not depend on any axioms") in s:
                      print(full, ":= AXIOM_PASS")
                      continue
                  raise SystemExit("Missing axiom receipt: " + full)
              found = {a.strip() for a in m.group(1).split(",") if a.strip()}
              if not found <= allowed:
                  raise SystemExit("Disallowed axioms: " + str(found - allowed))
              print(full, ":= AXIOM_PASS")
          print("SHARP_ENTROPY_AXIOM_AUDIT := PASS")
          PY
      - name: Preserve compiler receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urf-entropy-candidate-receipt
          path: ${{ runner.temp }}/urf-receipt/
          if-no-files-found: warn
