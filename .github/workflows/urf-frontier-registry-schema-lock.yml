name: urf-frontier-registry-schema-lock

on:
  push:
    paths:
      - 'docs/status/URF_FRONTIER_REGISTRY_V1.json'
      - 'scripts/check_urf_frontier_registry_schema_lock.py'
      - 'tests/test_urf_frontier_registry_schema_lock.py'
      - '.github/workflows/urf-frontier-registry-schema-lock.yml'
  pull_request:
    paths:
      - 'docs/status/URF_FRONTIER_REGISTRY_V1.json'
      - 'scripts/check_urf_frontier_registry_schema_lock.py'
      - 'tests/test_urf_frontier_registry_schema_lock.py'
      - '.github/workflows/urf-frontier-registry-schema-lock.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest && python -m pytest -q tests/test_urf_frontier_registry_schema_lock.py
