name: integrity-regenerate-once

permissions:
  contents: write

on:
  push:
    branches:
      - audit/pin-network-capability-verifier-20260904

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: audit/pin-network-capability-verifier-20260904
          persist-credentials: true
      - name: Regenerate and commit final-tree integrity state
        run: |
          git rm .github/workflows/integrity-regenerate-once.yml
          bash scripts/build-merkle.sh
          bash scripts/build-checksums.sh

          unexpected="$(git status --porcelain | grep -vE '^(D  \.github/workflows/integrity-regenerate-once\.yml| M CHECKSUMS\.txt| M transparency/files\.sha256| M transparency/merkle\.root)$' || true)"
          test -z "$unexpected" || { echo "$unexpected"; exit 1; }

          sha256sum CHECKSUMS.txt transparency/files.sha256 transparency/merkle.root

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHECKSUMS.txt transparency/files.sha256 transparency/merkle.root
          git commit -m 'integrity: regenerate guarded TSA state'
          git push origin HEAD:audit/pin-network-capability-verifier-20260904
