name: Finite holonomy research certificates

on:
  pull_request:
    paths:
      - 'experiments/finite_transport_holonomy/**'
      - '.github/workflows/finite-holonomy-certificates.yml'
  push:
    paths:
      - 'experiments/finite_transport_holonomy/**'
      - '.github/workflows/finite-holonomy-certificates.yml'

permissions:
  contents: read

jobs:
  finite-holonomy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run bounded finite research verifiers
        run: |
          set -eu
          python3 -B experiments/finite_transport_holonomy/urf_finite_transport_bridge_001.py
          python3 -B experiments/finite_transport_holonomy/urf_holonomy_noise_bridge_002.py
          python3 -B experiments/finite_transport_holonomy/urf_multicycle_bridge_003.py
          python3 -B experiments/finite_transport_holonomy/urf_local_global_bridge_004.py
