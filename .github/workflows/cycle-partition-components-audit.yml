name: Cycle partition connected components Lean audit
"on":
  pull_request:
    paths:
      - 'lean/URF/Foundation/CyclePartitionComponentsCandidate.lean'
      - '.github/workflows/cycle-partition-components-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Compile connected components and audit axiom dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.27.0'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'a3a10db0e9d66acbebf76c5e6a135066525ac900'
          SRC='lean/URF/Foundation/CyclePartitionComponentsCandidate.lean'
          test "$(git hash-object "$SRC")" = 'b307800e03b251b12cdf5a7fc656503a5347981b'
          lake build URF.Foundation.CyclePartitionGraphCandidate
          lake env lean "$SRC" 2>&1 | tee "$RUNNER_TEMP/component-count.log"
          python3 - "$RUNNER_TEMP/component-count.log" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf8').read()
          for name in ('cyclePartitionComponentEquiv','cyclePartition_components_card'):
              f='URF.EntropyBridge.'+name
              pattern=r"(?m)^'"+re.escape(f)+r"' (?:does not depend on any axioms|depends on axioms:\s*\[([^\]]*)\])"
              m=re.findall(pattern,s)
              if len(m)!=1:
                  raise SystemExit('MISSING_AXIOM_REPORT: '+f)
              ax={x.strip() for x in m[0].split(',') if x.strip()}
              if not ax <= {'propext','Classical.choice','Quot.sound'}:
                  raise SystemExit('UNEXPECTED_AXIOMS: '+f+' '+repr(ax))
              print('LEAN_VERIFIED_ISOLATED',f,sorted(ax))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cycle-component-count-log
          path: ${{ runner.temp }}/component-count.log
