name: Observation alphabet capacity audit
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'research/candidates/ObservationAlphabetCapacityCandidate.lean'
      - '.github/workflows/observation-alphabet-capacity-audit.yml'
permissions:
  contents: read
jobs:
  isolated-audit:
    if: github.head_ref == 'research/observation-alphabet-capacity-20261126'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: leanprover/lean-action@v1
        with:
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Compile and inspect exact candidate
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(head -n 1 lean-toolchain)" = 'leanprover/lean4:v4.27.0'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'a3a10db0e9d66acbebf76c5e6a135066525ac900'
          receipt="$RUNNER_TEMP/observation-capacity"
          mkdir -p "$receipt"
          git rev-parse HEAD | tee "$receipt/head.txt"
          lean --version | tee "$receipt/toolchain.txt"
          sha256sum research/candidates/ObservationAlphabetCapacityCandidate.lean | tee "$receipt/source.sha256"
          lake build +URF.Foundation.FiniteTranscriptCapacityBound 2>&1 | tee "$receipt/build.log"
          lake env lean research/candidates/ObservationAlphabetCapacityCandidate.lean 2>&1 | tee "$receipt/axioms.log"
          python3 - "$receipt/axioms.log" <<'PY'
          import re, sys
          from pathlib import Path
          log = Path(sys.argv[1]).read_text()
          prefix = "URF.Foundation.ObservationAlphabetAudit."
          names = ["swapDistribution", "swapDistribution_mutualInformation", "finiteMutualInformation_le_log_card_right", "transcript_mutual_information_le_time_log_card_observation"]
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          for name in names:
              m = re.search(r"'" + re.escape(prefix+name) + r"' depends on axioms:\s*\[([^\]]*)\]", log)
              if m:
                  axioms = {x.strip() for x in m.group(1).split(",") if x.strip()}
                  assert axioms <= allowed, (name, axioms)
              else:
                  assert "'" + prefix + name + "' does not depend on any axioms" in log, name
          print("AXIOM_AUDIT := PASS_4_OF_4")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: observation-alphabet-capacity-receipts
          path: ${{ runner.temp }}/observation-capacity/
