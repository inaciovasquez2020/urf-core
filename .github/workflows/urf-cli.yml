name: urf-cli package checks

on:
  pull_request:
    paths:
      - "urf-cli/**"
      - ".github/workflows/urf-cli.yml"
  push:
    branches:
      - main
    paths:
      - "urf-cli/**"
      - ".github/workflows/urf-cli.yml"
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./urf-cli build

      - name: Run CLI regression tests
        working-directory: urf-cli
        run: python -m unittest discover -s tests -v

      - name: Build source distribution and wheel
        working-directory: urf-cli
        run: python -m build

      - name: Confirm distribution artifacts exist
        working-directory: urf-cli
        run: |
          python -c "from pathlib import Path; p=Path('dist'); files=list(p.glob('*.whl'))+list(p.glob('*.tar.gz')); print('\n'.join(str(x) for x in files)); assert len(list(p.glob('*.whl'))) == 1; assert len(list(p.glob('*.tar.gz'))) == 1"
