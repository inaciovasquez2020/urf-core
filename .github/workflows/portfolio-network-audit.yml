name: Portfolio external artifact audit
on:
  push:
    branches:
      - work/portfolio-network-audit-20261029
  workflow_dispatch:
permissions:
  contents: read
jobs:
  external-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout URF audit host
        uses: actions/checkout@v4
      - name: Checkout pinned Chronos source
        uses: actions/checkout@v4
        with:
          repository: inaciovasquez2020/chronos-urf-rr
          ref: fb08ec739446572b0a439f563bd350917a60fa2e
          path: chronos-source
      - name: Download and hash pinned DESI data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-output
          base='https://raw.githubusercontent.com/CobayaSampler/bao_data/bb0c1c9009dc76d1391300e169e8df38fd1096db/desi_bao_dr2'
          curl --fail --location --retry 3 "$base/desi_gaussian_bao_ALL_GCcomb_mean.txt" -o audit-output/desi_mean.txt
          curl --fail --location --retry 3 "$base/desi_gaussian_bao_ALL_GCcomb_cov.txt" -o audit-output/desi_cov.txt
          sha256sum audit-output/desi_mean.txt audit-output/desi_cov.txt | tee audit-output/desi_sha256.txt
          wc -c -l audit-output/desi_mean.txt audit-output/desi_cov.txt | tee audit-output/desi_sizes.txt
          python - <<'PY' | tee audit-output/desi_dimensions.txt
          from pathlib import Path
          def numeric_rows(path):
              rows = []
              for line in Path(path).read_text().splitlines():
                  line = line.strip()
                  if not line or line.startswith("#"):
                      continue
                  try:
                      rows.append([float(x) for x in line.split()])
                  except ValueError:
                      if rows:
                          raise
              return rows
          mean = [line.split() for line in Path("audit-output/desi_mean.txt").read_text().splitlines() if line.strip() and not line.lstrip().startswith("#")]
          cov = numeric_rows("audit-output/desi_cov.txt")
          print("mean_measurements=", len(mean), "columns_per_row=", sorted({len(row) for row in mean}))
          print("covariance_rows=", len(cov), "columns_per_row=", sorted({len(row) for row in cov}))
          assert len(mean) == 13 and all(len(row) == 3 for row in mean), "unexpected mean measurement dimensions"
          for row in mean:
              float(row[0]); float(row[1])
          assert len(cov) == 13 and all(len(row) == 13 for row in cov), "unexpected covariance dimensions"
          PY
      - name: Download and inventory KiDS archive
        shell: bash
        run: |
          set -euo pipefail
          url='https://kids.strw.leidenuniv.nl/sci_data/KiDS_Legacy_cosmic_shear_data_release.tar.gz'
          curl --fail --location --retry 3 "$url" -o audit-output/kids-legacy-cosmic-shear.tar.gz
          sha256sum audit-output/kids-legacy-cosmic-shear.tar.gz | tee audit-output/kids_sha256.txt
          stat --printf='archive_bytes=%s\n' audit-output/kids-legacy-cosmic-shear.tar.gz | tee audit-output/kids_size.txt
          tar -tzf audit-output/kids-legacy-cosmic-shear.tar.gz | tee audit-output/kids_inventory.txt
          tar -tvzf audit-output/kids-legacy-cosmic-shear.tar.gz > audit-output/kids_inventory_detailed.txt
          python - <<'PY' | tee audit-output/kids_inventory_summary.txt
          from pathlib import Path
          names = Path("audit-output/kids_inventory.txt").read_text().splitlines()
          print("member_count=", len(names))
          for suffix in (".fits", ".fits.gz", ".txt", ".dat", ".cov", ".ini", ".yaml", ".yml", ".npy", ".npz"):
              matches = [x for x in names if x.lower().endswith(suffix)]
              if matches:
                  print(suffix, len(matches), *matches, sep="\n  ")
          PY
      - name: Retrieve cancer supplementary package through PMC OA metadata
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee audit-output/cancer_supplement_inventory.txt
          import hashlib, io, tarfile, urllib.request, xml.etree.ElementTree as ET, zipfile
          from pathlib import Path
          api = "https://www.ncbi.nlm.nih.gov/pmc/utils/oa/oa.fcgi?id=PMC8268167"
          req = urllib.request.Request(api, headers={"User-Agent": "URF-research-audit/1.0"})
          try:
              with urllib.request.urlopen(req, timeout=60) as r:
                  xml = r.read()
                  print("oa_api_http_status=", r.status, "xml_bytes=", len(xml))
              print(xml.decode("utf-8", "replace")[:3000])
              root = ET.fromstring(xml)
              links = [x.attrib.get("href") for x in root.iter("link") if x.attrib.get("href")]
              if not links:
                  raise RuntimeError("PMC OA API returned no package link")
              print("package_links=", links)
              url = next((x for x in links if x.endswith((".tar.gz", ".tgz"))), links[0])
              if url.startswith("ftp://ftp.ncbi.nlm.nih.gov/"):
                  url = url.replace("ftp://ftp.ncbi.nlm.nih.gov/", "https://ftp.ncbi.nlm.nih.gov/", 1)
              print("selected_package_url=", url)
              req = urllib.request.Request(url, headers={"User-Agent": "URF-research-audit/1.0"})
              with urllib.request.urlopen(req, timeout=120) as r:
                  blob = r.read()
                  print("package_http_status=", r.status, "package_bytes=", len(blob))
              print("package_sha256=", hashlib.sha256(blob).hexdigest())
              Path("audit-output/PMC8268167_oa_package.tar.gz").write_bytes(blob)
              with tarfile.open(fileobj=io.BytesIO(blob), mode="r:*") as t:
                  members = t.getmembers()
                  print("package_member_count=", len(members))
                  for m in members:
                      print("MEMBER", m.name, "bytes", m.size)
                  for m in members:
                      if m.isfile() and m.name.lower().endswith((".zip", ".xlsx", ".xls", ".csv", ".tsv", ".pdf")):
                          data = t.extractfile(m).read()
                          print("SUPPLEMENT_CANDIDATE", m.name, "bytes", len(data), "sha256", hashlib.sha256(data).hexdigest())
                          if m.name.lower().endswith(".zip"):
                              try:
                                  with zipfile.ZipFile(io.BytesIO(data)) as z:
                                      print("NESTED_ZIP_MEMBERS")
                                      for item in z.infolist():
                                          print(item.filename, item.file_size)
                              except Exception as e:
                                  print("nested_zip_error=", type(e).__name__, str(e))
          except Exception as e:
              print("SUPPLEMENT_RETRIEVAL_FAILED=", type(e).__name__, str(e))
          PY
      - name: Audit pinned Chronos source for numerical solver and lockfiles
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "chronos_commit=$(git -C chronos-source rev-parse HEAD)"
            echo "solver_or_benchmark_matches:"
            git -C chronos-source grep -n -I -E 'Regge.?Wheeler|Leaver|quasinormal|QNM|continued fraction|omega.*0\.747343' HEAD -- ':!*.svg' || true
            echo "dependency_lockfiles:"
            find chronos-source -type f \( -name 'uv.lock' -o -name 'poetry.lock' -o -name 'requirements*.txt' -o -name 'environment.yml' -o -name 'lake-manifest.json' -o -name 'Cargo.lock' \) -print | sort
          } | tee audit-output/chronos_solver_inventory.txt
      - name: Check PyPI 0.1.2 release JSON and download published artifacts
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --location --output audit-output/pypi-0.1.2.json --write-out '%{http_code}' 'https://pypi.org/pypi/urf-cli/0.1.2/json' || true)
          echo "pypi_json_http_status=$status" | tee audit-output/pypi_status.txt
          if [ "$status" = "200" ]; then
            python - <<'PY' | tee audit-output/pypi_artifacts.txt
          import json, urllib.request, hashlib
          data = json.load(open("audit-output/pypi-0.1.2.json"))
          print("version=", data["info"]["version"])
          for item in data.get("urls", []):
              url = item["url"]
              name = item["filename"]
              print("file=", name, "expected_sha256=", item["digests"]["sha256"], "size=", item["size"], "url=", url)
              req = urllib.request.Request(url, headers={"User-Agent": "portfolio-audit/1.0"})
              with urllib.request.urlopen(req, timeout=90) as r:
                  blob = r.read()
              actual = hashlib.sha256(blob).hexdigest()
              print("downloaded_bytes=", len(blob), "actual_sha256=", actual, "MATCH=", actual == item["digests"]["sha256"])
              assert actual == item["digests"]["sha256"], name
          PY
          else
            echo "PyPI release JSON not available; no artifact hashes can be independently checked." | tee -a audit-output/pypi_status.txt
          fi
      - name: Upload audit receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-network-audit
          path: audit-output/
          if-no-files-found: warn
          retention-days: 30
