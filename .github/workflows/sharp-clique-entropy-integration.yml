name: Sharp clique entropy integration
on:
  pull_request:
    paths:
      - 'lean/**'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/sharp-clique-entropy-integration.yml'
  push:
    branches: [main, integration/sharp-clique-entropy-20261118]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Full URF build and imported theorem audit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(head -n 1 lean-toolchain)" = 'leanprover/lean4:v4.27.0'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'a3a10db0e9d66acbebf76c5e6a135066525ac900'
          mkdir -p "$RUNNER_TEMP/sharp-receipt"
          git rev-parse HEAD > "$RUNNER_TEMP/sharp-receipt/head.txt"
          sha256sum lean/URF/Foundation/SharpCliqueEntropy.lean > "$RUNNER_TEMP/sharp-receipt/source.sha256"
          lake build URF 2>&1 | tee "$RUNNER_TEMP/sharp-receipt/build.log"
          cat > "$RUNNER_TEMP/SharpImportAudit.lean" <<'LEAN'
          import URF
          #print axioms URF.EntropyBridge.radiusOne_kernel_card_eq_pow_cliqueH1_candidate
          #print axioms URF.EntropyBridge.radiusOne_log_kernel_eq_cliqueH1_candidate
          #print axioms URF.EntropyBridge.radiusOne_entropy_le_cliqueH1_candidate
          #print axioms URF.EntropyBridge.radiusOne_uniform_entropy_eq_cliqueH1_candidate
          LEAN
          lake env lean "$RUNNER_TEMP/SharpImportAudit.lean" 2>&1 | tee "$RUNNER_TEMP/sharp-receipt/axioms.log"
          python3 - "$RUNNER_TEMP/sharp-receipt/axioms.log" <<'PY'
          import sys, re
          s = open(sys.argv[1]).read()
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          for name in ("radiusOne_kernel_card_eq_pow_cliqueH1_candidate",
                       "radiusOne_log_kernel_eq_cliqueH1_candidate",
                       "radiusOne_entropy_le_cliqueH1_candidate",
                       "radiusOne_uniform_entropy_eq_cliqueH1_candidate"):
              full = "URF.EntropyBridge." + name
              m = re.search(r"'" + re.escape(full) + r"' depends on axioms: \[([^\]]*)\]", s)
              if m is None:
                  if "'" + full + "' does not depend on any axioms" in s:
                      continue
                  raise SystemExit("Missing axiom receipt: " + full)
              found = {a.strip() for a in m.group(1).split(",") if a.strip()}
              if not found <= allowed:
                  raise SystemExit("Disallowed axioms: " + str(found - allowed))
          print("SHARP_MAIN_INTEGRATION_AXIOM_AUDIT := PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sharp-clique-entropy-integration-receipt
          path: ${{ runner.temp }}/sharp-receipt/
          if-no-files-found: warn
