name: Lean Action CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Lean toolchain only
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false

      - name: Build
        run: lake build

      - name: Install pytest
        run: python3 -m pip install . pytest

      - name: Targeted proof-status test
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m pip install . pytest
          PYTHONDONTWRITEBYTECODE=1 python3 -m pytest -q tests/test_remaining_math_targets.py
