name: Publish urf-cli to PyPI

on:
  pull_request:
    paths:
      - "urf-cli/**"
      - ".github/workflows/publish-urf-cli.yml"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Test and build urf-cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./urf-cli build twine

      - name: Run CLI regression tests
        working-directory: urf-cli
        run: python -m unittest discover -s tests -v

      - name: Build distributions
        working-directory: urf-cli
        run: |
          python -m build
          python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: urf-cli-dist
          path: urf-cli/dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish distributions to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/urf-cli/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: urf-cli-dist
          path: dist/

      - name: Publish to PyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
