name: Reconcile checksum manifest

on:
  push:
    branches:
      - audit/checksums-reconcile-20261015

permissions:
  contents: write

concurrency:
  group: checksum-reconcile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Reconcile existing manifest scope
        run: python3 scripts/reconcile_checksums.py . --write

      - name: Commit reconciled manifest
        shell: bash
        run: |
          if git diff --quiet -- CHECKSUMS.txt; then
            echo "CHECKSUMS.txt is already reconciled."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CHECKSUMS.txt
            git commit -m "[checksum-reconcile] Recalculate manifest from repository files"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Verify reconciled manifest
        run: python3 scripts/verify_checksums.py .
