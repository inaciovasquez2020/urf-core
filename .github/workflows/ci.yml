name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify network capability verifier pin
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          pin = json.loads(
              Path("security/policy/NETWORK_CAPABILITY_VERIFIER_PIN.json").read_text()
          )
          assert pin == {
              "schema": "urf.network-capability-verifier-pin.v1",
              "status": "PINNED_LOCAL_COPY_NO_EXECUTION_COUPLING",
              "upstream_repository": "https://github.com/inaciovasquez2020/urf-verifier",
              "upstream_commit": "53b8bfaf1c83b5245bd507b306b07645e3038b2b",
              "verified_ci_run": 33932582655,
              "required_files": {
                  "src/signed_network_capability.py": {
                      "blob_sha": "3222cec7d4c6facfe4577b68019ba44b567f8703"
                  },
                  "src/guarded_network_execution.py": {
                      "blob_sha": "3ab1867472c86c0a2609792c1b79e4085aad1b41"
                  },
                  "tests/test_guarded_network_execution.py": {
                      "blob_sha": "78ec972ae488f459a5c1aa997953be56b48cb751"
                  },
              },
              "local_materialization": {
                  "src/signed_network_capability.py": (
                      "scripts/network_capability/signed_network_capability.py"
                  ),
                  "src/guarded_network_execution.py": (
                      "scripts/network_capability/guarded_network_execution.py"
                  ),
              },
              "certified_property": (
                  "denied signed capability implies guarded_http_post does not invoke "
                  "its network opener"
              ),
              "runtime_fetch_permitted": False,
              "tsa_stamp_routed_through_guard": False,
          }

          def git_blob_sha(path: Path) -> str:
              data = path.read_bytes()
              header = f"blob {len(data)}\0".encode()
              return hashlib.sha1(header + data).hexdigest()

          for upstream_path, local_path in pin["local_materialization"].items():
              expected = pin["required_files"][upstream_path]["blob_sha"]
              assert git_blob_sha(Path(local_path)) == expected
          PY

      - name: Python tests
        run: |
          python3 -m pip install . pytest
          pip install . pytest
          pytest -q \
            tests/test_eclipse_witness_status_certification.py \
            tests/test_eclipse_witness_status_exclusivity.py \
            tests/test_eclipse_witness_status_uniqueness_certified.py \
            tests/test_eclipse_witness_preservation_pointwise.py \
            tests/test_eclipse_audit_witness_extraction.py \
            tests/test_eclipse_status_truthful_witness_determinacy.py \
            tests/test_eclipse_status_invariance_from_witness_preservation.py \
            tests/test_eclipse_status_invariance_bridge_composition.py \
            tests/test_eclipse_status_invariance_bridge_certified.py \
            tests/test_eclipse_reconstruction_stability_from_external_reproducibility.py \
            tests/test_eclipse_dependency_invariance_from_closure.py \
            tests/test_eclipse_concrete_assembly.py \
            tests/test_eclipse_extensionality_certified.py \
            tests/test_eclipse_general_reverse_lift.py \
            tests/test_eclipse_forward_implication.py \
            tests/test_eclipse_equivalence.py \
            tests/test_eclipse_closure_snapshot.py
