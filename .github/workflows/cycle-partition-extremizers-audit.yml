name: Cycle partition extremizers Lean audit
"on":
  pull_request:
    paths:
      - 'lean/URF/Foundation/CyclePartitionExtremizersCandidate.lean'
      - '.github/workflows/cycle-partition-extremizers-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Compile endpoint partitions and audit axiom dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.27.0'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 'a3a10db0e9d66acbebf76c5e6a135066525ac900'
          SRC='lean/URF/Foundation/CyclePartitionExtremizersCandidate.lean'
          test "$(git hash-object "$SRC")" = 'bc3318a37f09a891bbd6c1f5ead5c8766f3da3c8'
          lake env lean "$SRC" 2>&1 | tee "$RUNNER_TEMP/cycle-partitions.log"
          python3 - "$RUNNER_TEMP/cycle-partitions.log" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read()
          for name in ('maximalCycleLengths_length','maximalCycleLengths_sum',
                       'maximalCycleLengths_min','cyclePartition_count_le',
                       'cyclePartition_extremizers'):
              f='URF.EntropyBridge.'+name
              pattern=r"(?m)^'"+re.escape(f)+r"' (?:does not depend on any axioms|depends on axioms:\s*\[([^\]]*)\])"
              m=re.findall(pattern,s)
              if len(m)!=1:
                  raise SystemExit('MISSING_AXIOM_REPORT: '+f)
              ax={x.strip() for x in m[0].split(',') if x.strip()}
              if not ax <= {'propext','Classical.choice','Quot.sound'}:
                  raise SystemExit('UNEXPECTED_AXIOMS: '+f+' '+repr(ax))
              print('LEAN_VERIFIED_ISOLATED',f,sorted(ax))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cycle-partition-lean-log
          path: ${{ runner.temp }}/cycle-partitions.log
