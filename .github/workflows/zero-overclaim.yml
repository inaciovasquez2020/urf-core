name: zero-overclaim

on:
  push:
  pull_request:

jobs:
  verify-zero-overclaim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python3 -m pip install pytest
      - name: Verify zero-overclaim registry
        run: python3 tools/verify_zero_overclaim.py
      - name: Test zero-overclaim verifier
        run: python3 -m pytest -q tests/test_zero_overclaim.py
